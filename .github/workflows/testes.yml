name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Gerar a base fictícia
        run: python src/gerar_dados.py

      - name: Rodar a análise
        run: python src/analisar.py

      - name: Conferir se os resultados publicados batem com o código
        run: git diff --ignore-cr-at-eol --exit-code -- data reports

      - name: Testes de qualidade de dados
        run: python -m unittest discover -s tests -v
